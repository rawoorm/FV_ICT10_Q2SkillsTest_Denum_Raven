
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- PyScript -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <title>Non-Metal Elements | ICT 10</title>

    <style>
        body {
            background: linear-gradient(135deg, #071a33, #102f50, #164e63);
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            padding: 40px 15px;
        }

        .main-card {
            background: #ffffff;
            color: #183153;
            max-width: 650px;
            margin: auto;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-weight: bold;
            color: #123c69;
            font-size: 32px;
        }

        .header p {
            color: #64748b;
            font-size: 15px;
        }

        .atom-icon {
            font-size: 45px;
            margin-bottom: 10px;
        }

        .search-label {
            font-weight: bold;
            margin-bottom: 10px;
            color: #183153;
        }

        .search-input {
            width: 100%;
            padding: 14px;
            border: 2px solid #dbeafe;
            border-radius: 10px;
            outline: none;
            font-size: 16px;
            transition: 0.3s;
        }

        .search-input:focus {
            border-color: #0891b2;
            box-shadow: 0 0 8px rgba(8, 145, 178, 0.2);
        }

        .search-btn {
            width: 100%;
            height: 50px;
            margin-top: 18px;
            border: none;
            border-radius: 10px;
            background: #087eaa;
            color: white;
            font-weight: bold;
            font-size: 16px;
            transition: 0.3s;
        }

        .search-btn:hover {
            background: #075985;
        }

        .result {
            background: #eff8ff;
            border-radius: 15px;
            padding: 25px;
            margin-top: 30px;
            border-left: 5px solid #0891b2;
        }

        .result h3 {
            color: #123c69;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .result p {
            background: white;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            color: #334155;
            border: 1px solid #e2e8f0;
        }

        .result span {
            font-weight: bold;
            color: #087eaa;
        }

        .footer {
            text-align: center;
            color: #94a3b8;
            margin-top: 25px;
            font-size: 13px;
        }

        @media (max-width: 576px) {
            .main-card {
                padding: 25px 18px;
            }

            .header h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="main-card">

            <!-- Header -->
            <div class="header">
                <div class="atom-icon">⚛️</div>
                <h1>Non-Metal Elements</h1>
                <p>Periodic Table Information Finder</p>
                <p>Discover information about non-metal elements using their chemical symbols.</p>
            </div>

            <!-- Search Section -->
            <div class="search-section">

                <label class="search-label" for="element1">
                    Enter Element Symbol
                </label>

                <input
                    type="text"
                    id="element1"
                    class="search-input"
                    placeholder="Example: H, O, Cl, Ne, Xe"
                >

                <button
                    class="search-btn"
                    py-click="search_element">
                    🔍 Check Details
                </button>

            </div>

            <!-- Result Section -->
            <div class="result">

                <h3>📋 Search Result</h3>

                <p>
                    <b>Element:</b>
                    <span id="symbol"></span>
                </p>

                <p>
                    <b>Symbol:</b>
                    <span id="element"></span>
                </p>

                <p>
                    <b>Atomic Number:</b>
                    <span id="atomicnumber"></span>
                </p>

                <p>
                    <b>Atomic Mass:</b>
                    <span id="atomicmass"></span>
                    <small>u</small>
                </p>

            </div>

        </div>

        <!-- Footer -->
        <div class="footer">
            <p>ICT 10 | Periodic Table Information Finder</p>
        </div>

    </div>

    <!-- Python File -->
    <script type="py" src="main.py"></script>

</body>
</html>
